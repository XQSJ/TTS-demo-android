plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.ttsdemo'
    ndkVersion '29.0.13113456'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.ttsdemo"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // Product targets: ARMv8 64-bit and legacy ARMv7 32-bit.
            // 产品同时支持 ARMv8 64 位与 ARMv7 32 位。
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        noCompress += ['onnx']
    }
    packaging {
        jniLibs {
            // Piper Plus upstream also packages libonnxruntime.so. The Demo's
            // explicit compatibility runtime must win for legacy ARMv7.
            // Piper Plus 上游也携带 ORT；Demo 明确选择旧 ARMv7 兼容版本。
            pickFirsts += ['**/libonnxruntime.so']
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    // XQSJ modules are explicit and replaceable. Add only the frontend AARs
    // required by the exported model manifest.
    // XQSJ 模块显式拆分；按模型 manifest 只加入实际需要的前端 AAR。
    implementation files('libs/tts-sdk-core.aar')
    implementation files('libs/tts-frontend-espeak.aar')
    implementation files('libs/tts-frontend-piper.aar')
    implementation files('libs/tts-frontend-openjtalk.aar')

    // Demo supports legacy ARMv7, so it uses the clearly separated ORT
    // compatibility package. ARM64-only apps should use Microsoft's official
    // Maven dependency instead (documented in README).
    implementation files('libs/tts-runtime-ort-v7a.aar')

    // Upstream Piper Plus remains an ordinary Gradle dependency and is not
    // copied into our source tree or frontend AAR.
    implementation 'io.github.ayutaz:piper-plus-g2p-android:1.0.0'
    implementation libs.kotlin.stdlib
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    testImplementation libs.junit
    // Android's org.json classes are stubs in local JVM tests.
    // 本地 JVM 测试使用真实 JSON 实现，避免 Android stub 抛异常。
    testImplementation 'org.json:json:20240303'
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
